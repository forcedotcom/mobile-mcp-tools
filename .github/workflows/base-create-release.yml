name: Base Create Release
run-name: Create GitHub Release for ${{ inputs.package_display_name }}

on:
  workflow_call:
    inputs:
      package_display_name:
        description: 'Display name for the package (e.g., Mobile Web MCP Server)'
        required: true
        type: string
      package_path:
        description: 'Path to package directory (e.g., packages/mobile-web)'
        required: true
        type: string

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build GitHub Actions Scripts
        run: npx nx build project-maintenance-utilities

      - name: Build package
        env:
          PACKAGE_PATH: ${{ inputs.package_path }}
        run: npx nx build "$PACKAGE_PATH"

      - name: Run tests
        env:
          PACKAGE_PATH: ${{ inputs.package_path }}
        run: npx nx test "$PACKAGE_PATH"

      - name: Create release using orchestrator
        uses: actions/github-script@v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE_PATH: ${{ inputs.package_path }}
          PACKAGE_DISPLAY_NAME: ${{ inputs.package_display_name }}
        with:
          script: |
            const { createReleaseOrchestrator } = await import(`${process.env.GITHUB_WORKSPACE}/packages/project-maintenance-utilities/dist/index.js`);

            const orchestrator = createReleaseOrchestrator(context);
            await orchestrator.createRelease({
              packagePath: process.env.PACKAGE_PATH,
              packageDisplayName: process.env.PACKAGE_DISPLAY_NAME
            });
