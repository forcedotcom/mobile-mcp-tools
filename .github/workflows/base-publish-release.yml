name: Base Publish Release
run-name: Publish ${{ inputs.package_display_name }} Release ${{ inputs.release_tag }}

on:
  workflow_call:
    inputs:
      package_display_name:
        description: 'Display name for the package (e.g., Mobile Web MCP Server)'
        required: true
        type: string
      package_path:
        description: 'Path to package directory (e.g., packages/mobile-web)'
        required: true
        type: string
      release_tag:
        description: 'Release tag to publish (e.g., mobile-web-mcp-server_v1.0.0)'
        required: true
        type: string
      npm_tag:
        description: 'NPM tag to publish under (default: latest)'
        required: false
        type: string
        default: 'latest'
      dry_run:
        description: 'Perform a dry run (do not actually publish)'
        required: false
        type: boolean
        default: false

jobs:
  publish-release:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for OIDC
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Build GitHub Actions Scripts
        run: npx nx build project-maintenance-utilities

      - name: Publish release using orchestrator
        uses: actions/github-script@v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE_PATH: ${{ inputs.package_path }}
          PACKAGE_DISPLAY_NAME: ${{ inputs.package_display_name }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          NPM_TAG: ${{ inputs.npm_tag }}
          DRY_RUN: ${{ inputs.dry_run }}
        with:
          script: |
            const { createReleaseOrchestrator } = await import(`${process.env.GITHUB_WORKSPACE}/packages/project-maintenance-utilities/dist/index.js`);

            const orchestrator = createReleaseOrchestrator(context);
            await orchestrator.publishRelease({
              packagePath: process.env.PACKAGE_PATH,
              packageDisplayName: process.env.PACKAGE_DISPLAY_NAME,
              releaseTag: process.env.RELEASE_TAG,
              npmTag: process.env.NPM_TAG,
              dryRun: process.env.DRY_RUN === 'true'
            });
